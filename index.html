<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motion Moments</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell" aria-label="Motion photography wall">
    <section class="stage" id="stage" aria-label="Interactive photography wall">
      <div class="photo-wall" id="photo-wall" aria-hidden="true"></div>
      <div class="float-layer" id="float-layer" aria-hidden="true"></div>

      <nav class="top-nav" aria-label="Primary navigation">
        <a class="brand" href="#" aria-label="Motion home">Motion</a>
        <a href="#">Gallery</a>
        <a href="#">Pricing</a>
        <button class="avatar-button" type="button" aria-label="Open account">
          <span></span>
        </button>
      </nav>

      <button class="theme-button" id="theme-button" type="button" aria-label="Toggle light wall">
        <span class="sun-mark" aria-hidden="true"></span>
        <span class="theme-knob" aria-hidden="true"></span>
      </button>

      <article class="feature-card is-hidden" id="feature-card" aria-live="polite">
        <div class="card-controls" aria-label="Featured moment controls">
          <button type="button" id="previous-card" aria-label="Previous moment">&#8249;</button>
          <button type="button" id="next-card" aria-label="Next moment">&#8250;</button>
        </div>
        <p class="card-kicker" id="card-kicker">Image</p>
        <h1 id="card-title">Select a Moment</h1>
        <figure class="feature-image-wrap">
          <img id="card-image" src="assets/moments/moment-001.jpg" alt="Selected moment" />
        </figure>
        <p class="card-meta" id="card-meta">Midia / Imagens <span>Archive</span></p>
        <p class="card-copy" id="card-copy">
          Click an image in the wall to open it here.
        </p>
        <div class="card-actions">
          <button type="button">Order print</button>
          <button type="button">Inquire</button>
        </div>
      </article>

      <div class="side-actions left-actions is-hidden" aria-label="Moment shortcuts">
        <button type="button" aria-label="Like moment"><span aria-hidden="true">+</span></button>
        <button type="button" aria-label="Save moment"><span aria-hidden="true">[]</span></button>
      </div>

      <div class="side-actions right-actions is-hidden" aria-label="Share actions">
        <button type="button" aria-label="Upload moment"><span aria-hidden="true">^</span></button>
        <button type="button" aria-label="Download moment"><span aria-hidden="true">v</span></button>
        <button type="button" aria-label="Close moment"><span aria-hidden="true">x</span></button>
      </div>

      <div class="story-label">
        <p>A photography wall</p>
        <h2>Moments</h2>
        <span>Hover to separate a photo from the wall. Click it to open the moment.</span>
      </div>

      <div class="progress-rail" aria-hidden="true">
        <span id="progress-fill"></span>
      </div>
    </section>
  </main>

  <script src="assets/moments/manifest.js"></script>
  <script src="main.js"></script>
</body>
</html>
